---
# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
# Named for what it does, not for the protocol it speaks: "ACME-DNS" is
# character-for-character upstream joohoi/acme-dns, and this is a
# reimplementation rather than a packaging of it. The slug stays acme_dns, which
# is internal and already matches the convention official apps use.
name: DNS-01 Let's Encrypt challenge server
version: "1.0.0"
slug: acme_dns
description: >-
  acme-dns compatible server and account manager, providing DNS-01 challenge
  support for the Let's Encrypt app without giving it access to your real DNS
  zone
url: "https://github.com/NdS-Research-Facilities/ha-acme-dns"
# Promoted from experimental on 2026-08-15, once the app had issued a real
# production certificate on Home Assistant hardware: a Let's Encrypt leaf
# covering both a domain and its wildcard, validated against this server over
# DNS-01, with the DNS provider never holding an API credential.
stage: stable
arch:
  - aarch64
  - amd64
# Pre-built images, so installing is a pull rather than a build on the user's
# hardware. This is a multi-architecture manifest: CI publishes one per-arch
# image (aarch64-app-acme-dns, amd64-app-acme-dns) and then a manifest under this
# plain name, so no {arch} placeholder is needed here. build.yaml is used only by
# CI.
#
# The app- prefix follows home-assistant/apps-example, and keeps the name from
# reading as a build of upstream joohoi/acme-dns, which this is not.
#
# Nothing installs until that manifest exists -- see .github/workflows/.
image: "ghcr.io/nds-research-facilities/app-acme-dns"
init: false
# The DNS listener must be answering whenever Let's Encrypt validates, which is
# not a moment we control. This app therefore runs continuously; schedule the
# Let's Encrypt app instead. Starting on boot is the default, so `boot: auto` is
# left out -- the app linter rejects options set to their default value.
startup: services
map:
  - ssl:rw
# Left of the colon is the port inside the container, right is the port on the
# Home Assistant host. The container has its own network namespace, so listening
# on 53 in here never collides with the host's DNS plugin -- only the host-side
# number can. It defaults to 5354 for that reason, and is editable in the app's
# Network panel without touching this file.
#
# Forward external UDP+TCP 53 to host port 5354 on your router. DNS carries no
# port information in its payload, so the translation is transparent.
ports:
  53/udp: 5354
  53/tcp: 5354
ports_description:
  53/udp: DNS - forward external UDP 53 to this port on your router
  53/tcp: DNS over TCP - forward external TCP 53 to this port
# The HTTP API is deliberately absent from ports: it stays on the internal
# Docker network, reachable only by other apps such as Let's Encrypt.
options:
  zone: auth.example.org
  nsadmin: admin@example.org
  public_ip: ""
  api_base: ""
  domains: []
  allow_from: []
  api_port: 8080
  disable_registration: true
  verify_cname: true
  log_level: info
schema:
  zone: str
  nsadmin: email
  public_ip: str?
  api_base: str?
  domains:
    - str
  allow_from:
    - str?
  api_port: port
  disable_registration: bool?
  verify_cname: bool?
  log_level: list(trace|debug|info|warning|error)?
